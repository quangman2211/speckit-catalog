schema_version: "1.0"

extension:
  id: frontend
  name: "Frontend Workflow"
  version: "1.0.0"
  description: "Component contract, a11y audit va design-token check cho spec frontend"
  author: "Quang Man"
  repository: "https://github.com/quangman2211/speckit-catalog"
  license: "MIT"

requires:
  speckit_version: ">=0.9.0"
  commands:
    - "speckit.plan"

provides:
  commands:
    - name: speckit.frontend.component
      file: commands/component.md
      description: "Sinh component contract tu plan.md"
    - name: speckit.frontend.a11y
      file: commands/a11y.md
      description: "Soat spec theo WCAG 2.2 AA truoc khi implement"
  config:
    - name: "frontend-config.yml"
      template: "config-template.yml"
      description: "Cau hinh design system va nguong a11y"
      required: false

hooks:
  after_plan:
    command: speckit.frontend.component
    optional: true
    priority: 10
    prompt: "Sinh component contract tu plan vua tao?"
    description: "Derive component contracts after planning"
  before_implement:
    command: speckit.frontend.a11y
    optional: true
    priority: 5
    prompt: "Soat a11y truoc khi implement?"
    description: "WCAG gate before implementation"

tags:
  - "frontend"
  - "ui"
  - "a11y"
  - "design-system"

config:
  defaults:
    wcag_level: "AA"
    token_source: "design-tokens.json"
    component_dir: "contracts/components"
