schema_version: "1.0"

extension:
  id: phases
  name: "Phase Skills"
  version: "0.2.0"
  description: "Sau skill theo giai doan spec/plan — spec, kien truc, ADR, hop dong giao dien, he thiet ke, cong a11y — cong hook tu nhan dien giai doan va goi y skill dung luc"
  author: "Quang Man"
  repository: "https://github.com/quangman2211/speckit-catalog"
  license: "Apache-2.0"

requires:
  speckit_version: ">=0.9.0"

provides:
  commands:
    - name: speckit.phases.status
      file: commands/status.md
      description: "Bao dang o giai doan nao, thieu artifact gi, nen chay lenh gi tiep"
    - name: speckit.phases.suggest
      file: commands/suggest.md
      description: "Noi bo: hook user_prompt_submit tu goi. Khong can goi tay"
    - name: speckit.phases.architecture
      file: commands/architecture.md
      description: "Ghi mot quyet dinh kien truc thanh ADR co danh so trong docs/04-decisions/, kem cac phuong an da can nhac va he qua"
    - name: speckit.phases.design-handoff
      file: commands/design-handoff.md
      description: "Sinh hop dong giao dien contracts/ui.md tu plan.md — design token, component, trang thai, responsive, edge case, a11y — de ba vai lam song song khong bia giao dien"

    - name: speckit.phases.write-spec
      file: commands/write-spec.md
      description: "Soat va lam day spec.md: van de, muc tieu do duoc, non-goals kem ly do, user story, yeu cau MoSCoW, tieu chi nghiem thu"
    - name: speckit.phases.system-design
      file: commands/system-design.md
      description: "Thiet ke he thong va ghi docs/02-architecture.md — yeu cau, so do thanh phan, mo hinh du lieu, hang doi, phan tich danh doi"
    - name: speckit.phases.design-system
      file: commands/design-system.md
      description: "Soat he thiet ke tim gia tri hard-code va ten dat khong nhat quan, viet tai lieu component, hoac thiet ke component moi cho khop he da co"
    - name: speckit.phases.a11y
      file: commands/a11y.md
      description: "Cong WCAG 2.1 AA truoc khi implement: soat spec, plan va hop dong giao dien theo tuong phan, ban phim, vung cham, focus, screen reader"

  config:
    - name: "phases-config.yml"
      template: "config-template.yml"
      description: "Bat/tat goi y va dat nhip nhac lai"
      required: false

  scripts:
    - name: phase
      file: scripts/bash/phase.sh
      description: "Nhan dien giai doan, in JSON trang thai"
      runtimes:
        - bash
    - name: suggest
      file: scripts/bash/suggest.sh
      description: "Hook entry: format goi y tu trang thai"
      runtimes:
        - bash

hooks:
  before_implement:
    command: speckit.phases.a11y
    optional: true
    priority: 20
    prompt: "Soat a11y truoc khi implement?"
    description: "Cong WCAG chay truoc khi co code — sua luc con la chu re hon nhieu"

  after_plan:
    command: speckit.phases.design-handoff
    optional: true
    priority: 20
    prompt: "Sinh hop dong giao dien contracts/ui.md tu plan vua tao?"
    description: "Hop dong UI phai co truoc khi ba vai lam song song"

events:
  user_prompt_submit:
    command: speckit.phases.suggest
    timeout: 10

tags:
  - "sdd"
  - "phases"
  - "architecture"
  - "design-system"

config:
  defaults:
    enabled: true
    repeat_after: 10
    adr_dir: "docs/04-decisions"
    ui_contract: "contracts/ui.md"
    token_file: "design-tokens.json"
    wcag_level: "AA"
